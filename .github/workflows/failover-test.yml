# Brief 3-6: the database goes away mid-traffic and the API comes back on
# its own. A steady probe of /api/health/ready runs for 90 seconds; at the
# 20-second mark the Postgres container is restarted; the interruption is
# the time from the first failed probe to the first success after it. The
# job fails when that window exceeds 60 seconds or the API never recovers.
# Run by hand (workflow_dispatch); the numbers go to the job summary.

name: Failover test

on:
  workflow_dispatch:

jobs:
  failover:
    name: Database restart under traffic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alto
          POSTGRES_PASSWORD: alto_dev
          POSTGRES_DB: alto_people
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alto -d alto_people"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alto:alto_dev@localhost:5432/alto_people?schema=public
      DIRECT_URL: postgresql://alto:alto_dev@localhost:5432/alto_people?schema=public
      JWT_SECRET: test-jwt-secret-do-not-use-outside-tests-padding-pad-pad
      JWT_TTL_SECONDS: '3600'
      PAYOUT_ENCRYPTION_KEY: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
      APP_BASE_URL: http://127.0.0.1:5173
      RESEND_API_KEY: ''
      RESEND_FROM: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w @alto-people/shared run build
      - run: npm -w apps/api exec prisma migrate deploy
      - run: npm -w apps/api exec prisma generate
      - run: npm -w apps/api run db:seed
      - name: Start the API
        run: |
          npm -w apps/api run dev > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3001/health/ready > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3001/health/ready
      - name: Probe, restart the database, measure
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash apps/api/scripts/failover/probe.sh
      - name: Upload the probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failover-probe
          path: |
            failover-probe.log
            failover-report.md
            api.log
          retention-days: 14
