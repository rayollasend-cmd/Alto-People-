# Build an OpenCV.js that runs under our Content-Security-Policy.
#
# Every published OpenCV.js — all fourteen packages surveyed, plus the
# official CDN build — is compiled with Emscripten's DYNAMIC_EXECUTION on,
# so embind builds its invoker functions from strings at module init. Our
# CSP has no 'unsafe-eval' and is not getting one, so document scanning
# (the ID and void-cheque capture) dies before it starts and every capture
# falls back to manual cropping.
#
# Emscripten supports the way out: with -sDYNAMIC_EXECUTION=0 embind uses
# a closure-based invoker and generates no code at runtime. OpenCV's own
# build_js.py forwards build flags, so the fix is a build, not a patch.
#
# Run this by hand from the Actions tab. It takes a while (OpenCV from
# source), which is why it is not on push. It uploads the artifact AND —
# unless you turn that input off — commits it to a branch and opens a PR,
# so the only human step is reviewing and merging. Nothing is vendored
# until a build passes the no-code-generation check, twice: once on the
# build output, once on the exact file committed.
name: Build OpenCV.js (strict CSP)

on:
  workflow_dispatch:
    inputs:
      opencv_ref:
        description: OpenCV tag to build from
        default: '4.12.0'
        required: true
      emsdk_version:
        description: Emscripten SDK version
        default: '3.1.64'
        required: true
      open_pr:
        description: Commit the build to a branch and open a PR
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    # OpenCV from source, twice over (configure + compile). Generous, and
    # still cheaper than shipping a scanner that cannot run.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install ${{ inputs.emsdk_version }}
          ./emsdk activate ${{ inputs.emsdk_version }}

      - name: Fetch OpenCV
        run: git clone --depth 1 --branch ${{ inputs.opencv_ref }} https://github.com/opencv/opencv.git ~/opencv

      # The one flag that matters: DYNAMIC_EXECUTION=0 makes embind build
      # its invokers as closures instead of from strings, which is what
      # lets the module start under a CSP with no 'unsafe-eval'.
      # build_js.py folds --build_flags into CMAKE_C/CXX_FLAGS, which CMake
      # also passes at link, where -s settings take effect.
      #
      # Default module set on purpose. build_js.py already names each
      # module it wants (-DBUILD_opencv_dnn=ON and so on) and the bindings
      # generator's export list is written against exactly that set, so
      # trimming needs a matching custom --config, not a BUILD_LIST that
      # argues with it. Get a working build first; trim second, measured.
      #
      # Single file is the default here: the wasm is embedded in the .js,
      # so vendoring is one file and there is no second URL to resolve.
      - name: Build with DYNAMIC_EXECUTION=0
        run: |
          source ~/emsdk/emsdk_env.sh
          cd ~/opencv
          python3 ./platforms/js/build_js.py build_wasm \
            --build_wasm \
            --build_flags="-s DYNAMIC_EXECUTION=0"
          ls -la build_wasm/bin
          mkdir -p "$GITHUB_WORKSPACE/opencv-out"
          cp build_wasm/bin/opencv.js "$GITHUB_WORKSPACE/opencv-out/"
          # Only present when the build was told not to inline the wasm.
          if [ -f build_wasm/bin/opencv_js.wasm ]; then
            cp build_wasm/bin/opencv_js.wasm "$GITHUB_WORKSPACE/opencv-out/"
          fi
          ls -la "$GITHUB_WORKSPACE/opencv-out"

      # The whole point of the build. If the artifact still constructs
      # functions from strings, it will still die under our CSP, and a
      # green build that ships it would be worse than no build at all.
      - name: Refuse a build that still generates code
        run: |
          node apps/web/scripts/verify-opencv-csp.mjs opencv-out/opencv.js

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: opencv-js-strict-csp-${{ inputs.opencv_ref }}
          path: opencv-out/
          if-no-files-found: error

      # Vendor it on a branch and open a PR, so the only human step is
      # reviewing and merging — no downloading, unzipping or committing a
      # multi-megabyte file by hand.
      - name: Refuse a file too large to live in git
        run: |
          SIZE=$(stat -c%s opencv-out/opencv.js)
          echo "opencv.js is $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -gt 41943040 ]; then
            echo "Over 40 MB — that does not belong in the repository."
            echo "Trim the module list further, or host it and load it at runtime."
            exit 1
          fi

      - name: Open a PR with the vendored build
        if: ${{ inputs.open_pr }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="opencv-csp-${{ inputs.opencv_ref }}-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mkdir -p apps/web/vendor/opencv
          cp opencv-out/opencv.js apps/web/vendor/opencv/opencv.js
          if [ -f opencv-out/opencv_js.wasm ]; then
            cp opencv-out/opencv_js.wasm apps/web/vendor/opencv/
          fi
          # Prove it again from the repo copy — this is the file that ships.
          node apps/web/scripts/verify-opencv-csp.mjs apps/web/vendor/opencv/opencv.js
          git add apps/web/vendor/opencv
          git commit -m "build(scanning): vendor OpenCV ${{ inputs.opencv_ref }} built without dynamic execution

          Built by the 'Build OpenCV.js (strict CSP)' workflow with
          -s DYNAMIC_EXECUTION=0 and verified to generate no code at runtime. The vite alias picks it
          up on merge, which is what brings document scanning back under a
          CSP with no 'unsafe-eval'."
          git push origin "$BRANCH"
          # The branch is the valuable part and it is now safe on the
          # remote. Opening the PR can fail for a reason that has nothing
          # to do with the build — "GitHub Actions is not permitted to
          # create or approve pull requests" is a repository setting under
          # Settings → Actions → General → Workflow permissions — and a
          # 40-minute build must not be reported as a failure over it.
          set +e
          gh pr create \
            --title "Vendor OpenCV ${{ inputs.opencv_ref }} built for strict CSP" \
            --body "Document scanning has been falling back to manual cropping because every published OpenCV.js generates code at runtime, which our CSP forbids.

          This is a build made with \`-s DYNAMIC_EXECUTION=0\`, default module set. The workflow refused to upload it unless \`verify-opencv-csp.mjs\` found no runtime code generation, and the check ran again against this exact committed file.

          Merging swaps it in through the vite alias — no importing module changes. After it deploys, open the ID capture on a phone and confirm the live edge outline appears, with no CSP violation in the console.

          Built from OpenCV \`${{ inputs.opencv_ref }}\` with emsdk \`${{ inputs.emsdk_version }}\` by run ${{ github.run_id }}." \
            --base main \
            --head "$BRANCH"
          if [ $? -ne 0 ]; then
            COMPARE="https://github.com/${{ github.repository }}/compare/main...$BRANCH?expand=1"
            echo "::warning::The branch $BRANCH is pushed and verified; only opening the PR failed."
            echo "::warning::Open it here: $COMPARE"
            echo "::warning::To let this workflow do it: Settings -> Actions -> General -> Workflow permissions -> allow GitHub Actions to create pull requests."
          fi
