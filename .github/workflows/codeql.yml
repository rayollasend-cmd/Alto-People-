# CodeQL — static analysis of the TypeScript in all three packages (SOC 2
# CC7.1 / CC8.1; audit 2026-10-21 item 13: "no Dependabot or CodeQL"). Runs
# on every PR, on main, and weekly so a rule added upstream is applied to
# code that did not change. Findings land under Security → Code scanning.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1' # Mondays 06:30 UTC, after the dependency scan

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
