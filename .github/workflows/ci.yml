# CI — every PR and every push to main builds all three packages and runs
# both test suites. Railway auto-deploys main, so this check is the only
# thing standing between a broken commit and the production workforce.
#
# The API suite runs against a THROWAWAY postgres service container using
# the same alto/alto_dev/alto_people + schema=alto_test convention as
# local dev (docker compose / native install). globalSetup applies all
# migrations, takes its advisory lock (a no-op here — the container is
# exclusive), and truncates between tests exactly as it does locally.
# apps/api/.env.test is gitignored; CI supplies the same fixed test
# secrets through job env instead (dotenv quietly no-ops on the missing
# file and the process env wins).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A pull request's newer push replaces its older run. On main a run is
  # never cancelled mid-way: main moves faster than a full run, and
  # cancelling meant the API suite never finished there. A newer push
  # waits for the running one instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-web-tests:
    name: Build + web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Brief 2-5 step 7 (CC7.1): no high or critical advisory in production
      # dependencies unless accepted in security/accepted-risks.json with a
      # reason and an expiry. On a push to main the result is posted as SOC 2
      # evidence when the owner has set the two secrets.
      - name: Dependency scan
        run: node scripts/dependency-scan.mjs
        env:
          EVIDENCE_INGEST_URL: ${{ github.event_name == 'push' && secrets.EVIDENCE_INGEST_URL || '' }}
          EVIDENCE_INGEST_TOKEN: ${{ secrets.EVIDENCE_INGEST_TOKEN }}
      # Turborepo (docs/turborepo.md): the build, lint, typecheck and unit
      # test steps below run through turbo, and its task cache from earlier
      # runs comes back from GitHub's cache — a package whose inputs did not
      # change is restored (outputs and logs), not built or checked again.
      # Saved under this commit; restored from the newest earlier save. No
      # remote cache (that needs a Vercel account; the doc says how).
      - name: Restore the Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      # Builds shared, then web and api one at a time (the api build runs
      # prisma generate) — the command Railway runs.
      - run: npm run build
        env:
          TURBO_TELEMETRY_DISABLED: '1'
      # The bundle-size budget (apps/web/size-budget.json): a chunk that
      # grows past its line fails here, in the commit that grew it.
      - run: npm -w apps/web run size:check
      # One turbo run for the static checks, each package's own scripts:
      #  - lint: ESLint for web, api and shared. Web: design-system
      #    guardrails are warn-level on the existing debt (the warning count
      #    is the burndown metric) but any ERROR — parse failures included —
      #    fails the job. API and shared: typescript-eslint recommended +
      #    ESLint recommended, held at zero findings.
      #  - lint:design (web, design system step 1): the per-file counts of
      #    retired patterns (text-white, inline hex, hand-rolled pills, bare
      #    empty and loading text, raw headings) may only fall.
      #  - lint:i18n (web, brief 3-6): every associate-app key exists in all
      #    six app languages, and the hard-coded string count may only fall.
      #  - typecheck: web (tsc -b and the Storybook config), api (the source
      #    and the test suite — vitest alone would not notice a fixture
      #    drifting from the types it fakes), shared.
      # Two at a time: the api and web typechecks are the memory-heavy ones.
      - name: Lint and typecheck (turbo)
        run: npx turbo run lint lint:design lint:i18n typecheck --concurrency=2
        env:
          TURBO_TELEMETRY_DISABLED: '1'
      # The web unit suite, and the shared package's own (workweek math,
      # roles, formatting). The API suite needs Postgres: the api-tests job.
      - name: Unit tests, web and shared (turbo)
        run: npx turbo run test --filter=@alto-people/web --filter=@alto-people/shared
        env:
          TURBO_TELEMETRY_DISABLED: '1'

  # Storybook (apps/web/.storybook/README.md): the UI kit, the page templates
  # and the shell pieces, every story rendered in Chromium at its viewport
  # (390 or 1440) with axe on the result — WCAG 2.2 AA, the full-stack
  # sweep's rules — once in the light theme and once in the dark. A
  # violation fails the job. No Postgres and no API: stories answer /api/*
  # from their own mocks.
  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w @alto-people/shared run build
      - run: npm -w apps/web run build-storybook
      - run: npm -w apps/web exec playwright install --with-deps chromium
      - run: npm -w apps/web run test-storybook
      - name: Upload the static Storybook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/web/storybook-static/
          retention-days: 7

  api-tests:
    # Four shards, each against its own throwaway Postgres (the service
    # container is per job), so the suite takes ~40 min instead of ~2.5 h.
    name: API tests (postgres, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # A shard takes 30-70 min on a hosted runner. A hung test fails here, with
    # its log, instead of holding main's queue for GitHub's six-hour default.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alto
          POSTGRES_PASSWORD: alto_dev
          POSTGRES_DB: alto_people
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alto -d alto_people"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://alto:alto_dev@localhost:5432/alto_people?schema=alto_test
      DIRECT_URL: postgresql://alto:alto_dev@localhost:5432/alto_people?schema=alto_test
      # Fixed test secrets — same values as .env.test.example; never used
      # outside tests.
      JWT_SECRET: test-jwt-secret-do-not-use-outside-tests-padding-pad-pad
      JWT_TTL_SECONDS: '3600'
      PAYOUT_ENCRYPTION_KEY: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
      APP_BASE_URL: http://localhost:5173
      # Explicit blanks keep the email layer in stub mode.
      RESEND_API_KEY: ''
      RESEND_FROM: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w @alto-people/shared run build
      - run: npm -w apps/api exec prisma generate
      - run: npm -w apps/api exec -- vitest run --shard=${{ matrix.shard }}/4

  # Full-stack browser suite: real API + real Postgres + Vite dev server,
  # driven through Chromium's Pixel 7 profile. This is the only layer that
  # exercises login → dashboard → schedule the way an associate's phone
  # does, and it carries the horizontal-overflow guard ("the swing").
  # --workers=1 because parallel logins trip the API's login rate limiter.
  e2e-tests:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alto
          POSTGRES_PASSWORD: alto_dev
          POSTGRES_DB: alto_people
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alto -d alto_people"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # public schema (dev-shaped DB, seeded below) — NOT alto_test.
      DATABASE_URL: postgresql://alto:alto_dev@localhost:5432/alto_people?schema=public
      DIRECT_URL: postgresql://alto:alto_dev@localhost:5432/alto_people?schema=public
      JWT_SECRET: test-jwt-secret-do-not-use-outside-tests-padding-pad-pad
      JWT_TTL_SECONDS: '3600'
      PAYOUT_ENCRYPTION_KEY: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
      APP_BASE_URL: http://127.0.0.1:5173
      RESEND_API_KEY: ''
      RESEND_FROM: ''
      # Lighthouse CI signs the admin and the associate in once more after
      # the suite's own sign-ins; the per-email limiter (5 / 15 min) is a
      # production guard, not a test subject.
      LOGIN_EMAIL_LIMIT: '500'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w @alto-people/shared run build
      - run: npm -w apps/api exec prisma migrate deploy
      - run: npm -w apps/api exec prisma generate
      # Dev seed (maria.lopez + admin accounts) + a realistic schedule so
      # the associate specs see real content instead of empty states.
      - run: npm -w apps/api run db:seed
      - run: npm -w apps/api exec tsx scripts/seed-demo-shifts.ts
      - run: npm -w apps/web exec playwright install --with-deps chromium
      - name: Start API + web dev servers
        run: |
          # Every spec signs in from this one address; the per-IP login
          # limiter (20/min) is a production guard, not a test subject.
          LOGIN_IP_LIMIT=500 npm -w apps/api run dev > api.log 2>&1 &
          npm -w apps/web run dev > web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3001/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3001/health
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5173 > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:5173
      - name: Run Playwright suite
        env:
          E2E_FULLSTACK: '1'
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npm -w apps/web exec -- playwright test --workers=1
      # Lighthouse CI (apps/web/lighthouse/README.md) on the PRODUCTION
      # build — vite build, served by `vite preview` with /api proxied to the
      # API started above: the public pages signed out (phone), the admin's
      # home, clients, scheduling and payroll signed in (desktop), the
      # associate's home signed in (phone). Accessibility under 0.95 fails
      # the job; performance, best practices and the LCP/CLS/TBT budgets
      # warn. The scores land in the job summary; the reports go to this
      # run's artifacts only — never temporary-public-storage, because the
      # signed-in pages hold company data.
      - name: Build the web app (production)
        run: npm -w apps/web run build
      - name: Lighthouse CI
        run: npm -w apps/web run lhci
      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/web/e2e-results/lighthouse/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            apps/web/e2e-results/
            api.log
            web.log
          retention-days: 7

  a11y:
    name: Accessibility (axe, full stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alto
          POSTGRES_PASSWORD: alto_dev
          POSTGRES_DB: alto_people
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alto -d alto_people"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alto:alto_dev@localhost:5432/alto_people?schema=public
      DIRECT_URL: postgresql://alto:alto_dev@localhost:5432/alto_people?schema=public
      JWT_SECRET: test-jwt-secret-do-not-use-outside-tests-padding-pad-pad
      JWT_TTL_SECONDS: '3600'
      PAYOUT_ENCRYPTION_KEY: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
      APP_BASE_URL: http://127.0.0.1:5173
      RESEND_API_KEY: ''
      RESEND_FROM: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w @alto-people/shared run build
      - run: npm -w apps/api exec prisma migrate deploy
      - run: npm -w apps/api exec prisma generate
      # The same seed the E2E job and the design walk use: every persona the
      # accessibility sweep signs in as, with a realistic schedule behind them.
      - run: npm -w apps/api run db:seed
      - run: npm -w apps/api exec tsx scripts/seed-demo-shifts.ts
      - run: npm -w apps/web exec playwright install --with-deps chromium
      - name: Start API + web dev servers
        run: |
          LOGIN_IP_LIMIT=500 npm -w apps/api run dev > api.log 2>&1 &
          npm -w apps/web run dev > web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3001/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3001/health
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5173 > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:5173
      # The sweep behind the accessibility statement (/accessibility): every
      # persona, every walked surface, dark and light, WCAG 2.2 AA. A serious
      # or critical finding fails the build; e2e/axe-allowlist.json is the
      # only way past it, with a reason.
      - name: Accessibility sweep
        env:
          E2E_FULLSTACK: '1'
          A11Y_SWEEP: '1'
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npm -w apps/web exec -- playwright test e2e/axe-sweep.spec.ts --workers=1
      - name: Upload the axe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-reports
          path: |
            apps/web/e2e-results/
            api.log
            web.log
          retention-days: 14
